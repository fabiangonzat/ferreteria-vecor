services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vecor}
      POSTGRES_USER: ${POSTGRES_USER:-vecor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vecor_dev}
    volumes:
      - vecor_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - ./database/migrations/002_analytics.sql:/docker-entrypoint-initdb.d/003-analytics.sql:ro
      - ./database/seed_demo.sql:/docker-entrypoint-initdb.d/004-seed-demo.sql:ro
      - ./database/seed_history_demo.sql:/docker-entrypoint-initdb.d/005-seed-history.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-vecor}:${POSTGRES_PASSWORD:-vecor_dev}@db:5432/${POSTGRES_DB:-vecor}
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-sharing}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_ORIGIN: http://localhost:${APP_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  vecor_data:
